name: CI - Native AOT
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  aot-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Start Pulsar
        run: docker run -d --name pulsar -p 6650:6650 -p 8080:8080 apachepulsar/pulsar:4.0.9 bin/pulsar standalone

      - name: Publish smoke test as Native AOT
        run: dotnet publish ./tests/DotPulsar.AotSmokeTest/DotPulsar.AotSmokeTest.csproj -c Release -r linux-x64 -o ./aot-out

      - name: Wait for Pulsar
        run: timeout 300 bash -c 'until curl -sf http://localhost:8080/admin/v2/brokers/health > /dev/null; do sleep 5; done'

      - name: Run smoke test
        env:
          PULSAR_SERVICE_URL: pulsar://localhost:6650
        run: ./aot-out/DotPulsar.AotSmokeTest

      - name: Pulsar logs
        if: failure()
        run: docker logs --tail 200 pulsar
